name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Build installers (x64 + ia32, Windows 7/10/11)
        run: npx electron-builder --win --x64 --ia32 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Install NSIS
        run: choco install nsis -y --no-progress
        continue-on-error: true

      - name: Build single setup with 32/64-bit choice
        run: '& "C:\Program Files (x86)\NSIS\makensis.exe" /V2 installer.nsi'
        shell: pwsh
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: Parus-Setup
          path: dist/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
