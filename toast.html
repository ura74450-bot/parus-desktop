<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font:14px/1.35 "Segoe UI",system-ui,sans-serif;user-select:none;cursor:default}
.card{position:absolute;inset:6px;border-radius:16px;background:#171b22;border:1px solid #ffffff1c;box-shadow:0 8px 26px #000a;display:flex;gap:12px;align-items:center;padding:12px 14px 14px;overflow:hidden;color:#eef1f6;cursor:pointer;animation:in .5s cubic-bezier(.2,1.25,.3,1)}
.card.out{animation:out .32s cubic-bezier(.5,0,.8,.4) forwards}
@keyframes in{from{transform:translateX(115%);opacity:0}}
@keyframes out{to{transform:translateX(115%);opacity:0}}
.av{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:21px;color:#fff;overflow:hidden;background:#3a4252;animation:pop .55s .15s backwards cubic-bezier(.3,1.7,.5,1)}
.av img{width:100%;height:100%;object-fit:cover}
@keyframes pop{from{transform:scale(.3);opacity:0}}
.tx{min-width:0;flex:1}
.top{display:flex;align-items:center;gap:6px}
.t{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.app{font-size:11px;color:#8b94a5;display:flex;align-items:center;gap:4px;flex:none}
.app i{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,#7c5cff,#3ecbff)}
.b{color:#c9d0dc;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;margin-top:2px;animation:up .45s .2s backwards}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.x{position:absolute;top:6px;right:8px;width:22px;height:22px;border-radius:50%;border:0;background:#ffffff14;color:#fff;font-size:13px;line-height:1;cursor:pointer;opacity:0;transition:opacity .2s,background .2s}
.card:hover .x{opacity:1}.x:hover{background:#ffffff30}
.card:hover .app{visibility:hidden}
.bar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:linear-gradient(90deg,#7c5cff,#3ecbff);transform-origin:left;animation:bar 7s linear forwards}
.card:hover .bar{animation-play-state:paused}
.card.sticky .bar{animation:pulse 1.4s ease-in-out infinite;transform:none}
@keyframes bar{to{transform:scaleX(0)}}
@keyframes pulse{50%{opacity:.25}}
</style></head>
<body>
<div class="card" id="c">
  <div class="av" id="av"></div>
  <div class="tx"><div class="top"><div class="t" id="t"></div><div class="app"><i></i>Parus</div></div><div class="b" id="b"></div></div>
  <button class="x" id="x" title="Закрыть">✕</button>
  <div class="bar" id="bar"></div>
</div>
<script>
const $=id=>document.getElementById(id);let key='',closing=false;
function close(){if(closing)return;closing=true;$('c').classList.add('out');setTimeout(()=>window.parusToast.close(),330)}
window.parusToast.onData(d=>{
  key=d.key||'';$('t').textContent=d.title;$('b').textContent=d.body;
  const av=$('av');
  if(d.avatar){const i=new Image();i.onerror=()=>letter();i.src=d.avatar;av.appendChild(i)}else letter();
  function letter(){av.textContent=(d.title||'?').replace(/^[^\p{L}\p{N}]+/u,'').charAt(0).toUpperCase()||'P';av.style.background='hsl('+([...d.title].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360)+' 55% 45%)'}
  if(d.sticky)$('c').classList.add('sticky');
});
$('bar').addEventListener('animationend',e=>{if(e.animationName==='bar')close()});
$('c').addEventListener('click',()=>{window.parusToast.click(key)});
$('x').addEventListener('click',e=>{e.stopPropagation();close()});
</script></body></html>
