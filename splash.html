<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Parus</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#0e1116;color:#eef1f6;font:15px/1.4 "Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 30%,#2b2170,#0e1116 65%)}
img{width:120px;height:120px;border-radius:28px;animation:float 3s ease-in-out infinite,in .7s cubic-bezier(.3,1.5,.5,1);box-shadow:0 18px 50px #7c5cff55}
@keyframes float{50%{transform:translateY(-10px)}}@keyframes in{from{transform:scale(.5);opacity:0}}
h1{margin:0;font-size:26px;letter-spacing:.5px;animation:up .6s .1s backwards}
p{margin:0;color:#8b94a5;min-height:22px;text-align:center;padding:0 24px;animation:up .6s .2s backwards}
@keyframes up{from{transform:translateY(12px);opacity:0}}
.bar{width:180px;height:4px;border-radius:2px;background:#ffffff1a;overflow:hidden;position:relative}
.bar::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:2px;background:linear-gradient(90deg,#7c5cff,#3ecbff);animation:slide 1.3s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
</style></head>
<body>
<img src="build/icon.png" alt=""><h1>Parus</h1><div class="bar"></div><p id="st">Подключаемся…</p>
<script>
const u=new URLSearchParams(location.search).get('u');let n=0;const st=document.getElementById('st');
async function tick(){
  n++;
  try{const c=new AbortController(),t=setTimeout(()=>c.abort(),9000);
    await fetch(u+'/health?_='+Date.now(),{mode:'no-cors',cache:'no-store',signal:c.signal});clearTimeout(t);location.replace(u);return}
  catch{if(n>1)st.textContent=navigator.onLine?'Сервер просыпается… это может занять до минуты':'Нет подключения к интернету — ждём…';setTimeout(tick,3000)}
}
tick();
</script></body></html>
